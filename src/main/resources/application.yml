server:
  port: ${PORT:8080}

spring:
  application:
    name: pho-viet-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/pho_1986_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET:pho_gia_truyen_1986_spring_boot_jwt_secret_key_very_long_for_hmac_sha_256}
    expiration-ms: 900000 # 15 minutes
    refresh-expiration-ms: 604800000 # 7 days
  cors:
    allowed-origins: ${CLIENT_ORIGIN:http://localhost:5173,http://localhost:3000}
  payment:
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:pho1986_webhook_secret_key_prod_auth_2026}

payment:
  sepay:
    enabled: ${SEPAY_ENABLED:false}
    environment: ${SEPAY_ENV:sandbox}
    merchant-id: ${MERCHANTID:}
    secret-key: ${SEPAY_SECRETKEY:}
    ipn-secret: ${SEPAY_IPN_SECRET:}
    ipn-url: ${SEPAY_IPN_URL:http://localhost:8080/api/v1/payments/sepay/ipn}
    success-url: ${SEPAY_SUCCESS_URL:http://localhost:8080/api/v1/payments/sepay/return/success}
    error-url: ${SEPAY_ERROR_URL:http://localhost:8080/api/v1/payments/sepay/return/error}
    cancel-url: ${SEPAY_CANCEL_URL:http://localhost:8080/api/v1/payments/sepay/return/cancel}
    booking-frontend-redirect-url: ${SEPAY_BOOKING_FRONTEND_REDIRECT_URL:http://localhost:5173#order}
    frontend-redirect-url: ${SEPAY_FRONTEND_REDIRECT_URL:http://localhost:5173#order}
  momo:
    enabled: ${MOMO_ENABLED:false}
    partner-code: ${MOMO_PARTNER_CODE:MOMO}
    access-key: ${MOMO_ACCESSKEY:}
    secret-key: ${MOMO_SECRETKEY:}
    endpoint: ${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}
    redirect-url: ${MOMO_REDIRECT_URL:http://localhost:5173#order}
    ai-coin-redirect-url: ${MOMO_AI_COIN_REDIRECT_URL:http://localhost:5173#order}
    ipn-url: ${MOMO_IPN_URL:http://localhost:8080/api/v1/payments/momo/ipn}
    request-type: ${MOMO_REQUEST_TYPE:captureWallet}
    language: ${MOMO_LANGUAGE:vi}
    timeout: ${MOMO_TIMEOUT:30s}


