name: CI/CD - Build & Deploy Backend to AWS EC2

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 21 (Corretto)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: maven

      - name: 3. Make Maven Wrapper executable
        run: chmod +x ./mvnw

      - name: 4. Build and Package JAR
        run: ./mvnw clean package

      - name: 5. Copy JAR to EC2 via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/*.jar"
          target: "/tmp"
          strip_components: 1

      - name: 6. Deploy JAR and Restart Systemd Service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "🚀 [Deploy] Deploying new backend JAR..."
            sudo mkdir -p /opt/pho1986
            sudo cp /tmp/*.jar /opt/pho1986/pho-viet-backend.jar
            sudo rm -f /tmp/*.jar
            sudo chown -R ec2-user:ec2-user /opt/pho1986
            
            echo "🔄 [Deploy] Restarting pho-backend systemd service..."
            sudo systemctl restart pho-backend
            
            echo "📊 [Deploy] Checking service status..."
            sudo systemctl status pho-backend --no-pager
